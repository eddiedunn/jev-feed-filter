# Stories older than this many days are dropped; some blog feeds hold years of posts.
days = 4

# Stories from these sites are dropped before Jev sees them. A starter list of
# sites known to paywall; add any site that asks you to pay.
paywall_domains = [
  "nytimes.com", "washingtonpost.com", "wsj.com", "ft.com", "bloomberg.com",
  "economist.com", "theatlantic.com", "newyorker.com", "latimes.com",
  "businessinsider.com", "theinformation.com", "barrons.com", "bostonglobe.com",
  "chicagotribune.com", "wired.com", "thetimes.co.uk", "telegraph.co.uk",
  "seattletimes.com", "sfchronicle.com", "nymag.com", "vanityfair.com",
  "foreignpolicy.com", "foreignaffairs.com", "hbr.org", "marketwatch.com",
  "fortune.com", "insider.com",
]

# Exact words or phrases (case-insensitive). Any match hides the story.
hide_keywords = []

# Plain-English topics. Jev hides a story that is mainly about one of these.
hide_topics = [
  "sports",
  # "celebrity gossip",
]

# Story formats to hide (straight_news, analysis, opinion, promotional), for major news and for
# stories that match an interest. Blog posts and essays often count as opinion.
hide_formats = ["opinion", "promotional"]
interest_hide_formats = ["promotional"]

# A story outside your interests is shown as major news only when at least this many outlets
# cover the same event and Jev rates it likely major (see major_news below). Each event gets
# one card.
major_min_outlets = 3

# What you want to see, in the order of the filter buttons. Jev files each item under the
# interest it matches best. A news story that matches none is shown under "Major news" only if
# it is significant enough; a video that matches none goes under "Other".
# hide_routine_business hides funding rounds, earnings and similar routine business stories.
[[interests]]
name = "AI"
about = "artificial intelligence: AI models, research, tools, or how AI systems are built and used"
hide_routine_business = true

[[interests]]
name = "Crypto"
about = "cryptocurrency or blockchain: Bitcoin, Ethereum, crypto markets, protocols, or crypto security"

[[interests]]
name = "New tech"
about = "new technology or innovation: new hardware, energy, biotech, space, robotics, or scientific breakthroughs"
hide_routine_business = true

[[interests]]
name = "IT & engineering"
about = "software, IT or systems engineering: programming, infrastructure, devops, cloud, Linux, or computer security"
hide_routine_business = true

[[interests]]
name = "Eastern religion"
about = "Eastern religion or contemplative practice: Buddhism, Zen, Taoism, Hinduism, Vedanta, or meditation"

[[interests]]
name = "Spirituality"
about = "spirituality, consciousness, or philosophy of mind: non-duality, mindfulness, or the inner life"

[jev]
model = "~typesafe/jev-latest"
base_url = "https://openrouter.ai/api"
api_key_env = "OPENROUTER_API_KEY"
# gopass_key = "path/to/key"        # optional: read the key from gopass if the env var is unset
concurrency = 10

# Probability at or above which a story is hidden.
strong_slant = 0.5
topic_match = 0.7
interest_match = 0.5      # file an item under an interest
major_news = 0.7          # chance an event is major or historic news, for the major news group
woo = 0.5
routine_business = 0.6

# Used to spot stories about the same event, so major news gets one card per event.
[embeddings]
model = "openai/text-embedding-3-small"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# gopass_key = "path/to/key"
same_event = 0.45                   # how close in meaning (0 to 1) two stories must be

[youtube]
channel_handle = ""                 # e.g. "@YourHandle"; subscriptions must be public. Empty skips YouTube.
# Key comes from YOUTUBE_API_KEY, or uncomment:
# gopass_key = "path/to/key"
days = 3                            # how far back to look

# Same idea as news: exact words hide a video; topics are judged by Jev.
hide_keywords = []
hide_topics = ["sports"]
